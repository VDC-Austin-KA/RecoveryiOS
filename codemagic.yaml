# Codemagic CI for RecoveryiOS — works with zero setup (no Apple account, no env vars).
# Every push: generate config → unit tests on a simulator → unsigned Release build →
# RecoveryiOS-unsigned.ipa artifact for Sideloadly/AltStore (they re-sign with your Apple ID).
workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    triggering:
      events: [push]
      cancel_previous_builds: true
    scripts:
      - name: Generate Configuration.plist
        script: bash scripts/generate_config.sh
      - name: Unit tests
        script: bash scripts/ci_test.sh
        test_report: build/junit.xml
      - name: Build unsigned IPA
        script: bash scripts/ci_build_ipa.sh
    artifacts:
      - build/*.ipa
      - build/xcodebuild-test.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients: [keithacker33@gmail.com]
        notify: { success: true, failure: true }
